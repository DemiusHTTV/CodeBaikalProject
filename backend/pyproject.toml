[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dmitriy", email = "babygreenyoda@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=4.1",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "openai>=3.3.1",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    "sqlglot>=30.17.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
